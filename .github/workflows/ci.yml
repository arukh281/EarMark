# Earmark CI: contract check, Python CPU tests, the C++ engine under ASan/UBSan (plus a
# GCC release build), the Emscripten WASM build (uploaded as an artefact) and, on main,
# the Suite B reproduction gates. Everything runs on ubuntu-24.04 with Python 3.12,
# the same interpreter as local development. tests/test_tooling.py checks this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Pinned Emscripten release for the WASM build (bump deliberately, never "latest").
  EMSDK_VERSION: "6.0.9"
  # CPU-only torch wheels; the plain PyPI wheel would pull the CUDA stack.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  contract:
    name: Signal contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Generated constants match contract/signal.yaml
        run: uv run --no-project --python "$PYTHON_VERSION" --with pyyaml python contract/codegen.py --check

  python:
    name: Python tests (CPU, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install ffmpeg (enables the Opus round-trip tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Create .venv with CPU-only torch
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python -e ".[dev]" \
            --index-url "$TORCH_INDEX" --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match
          .venv/bin/python -c "import torch; assert not torch.cuda.is_available(); print('torch', torch.__version__)"
      - name: Contract check
        run: make contract-check
      - name: Engine goldens are in sync with the Python references
        run: make goldens-check
      - name: CPU unit tests (contract, data, model, trainer, export, eval)
        run: make test

  engine:
    name: Engine (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang, ASan + UBSan
            cc: clang
            cxx: clang++
            target: engine-sanitize
          - name: gcc, release
            cc: gcc
            cxx: g++
            target: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Lower ASLR entropy so ASan's shadow mapping fits
        if: matrix.target == 'engine-sanitize'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build and run the Catch2 tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make ${{ matrix.target }}

  wasm:
    name: WebAssembly build (Emscripten)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build earmark.wasm (SIMD128, STANDALONE_WASM, fixed memory)
        run: engine/wasm/build.sh engine/build-wasm
      - name: Upload earmark.wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: earmark-wasm
          path: engine/build-wasm/earmark.wasm
          if-no-files-found: error
          retention-days: 30
      - name: Smoke-test the module in node (identity at 16 kHz, tone at 48 kHz)
        run: node engine/wasm/smoke.mjs engine/build-wasm/earmark.wasm

  gates:
    # Needs about 326 MB from Edinburgh DataShare plus the GTCRN checkpoints (cached by pin),
    # so it runs on main and on demand, never on pull requests.
    name: Suite B gates (VoiceBank+DEMAND)
    if: github.event_name != 'pull_request'
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Create .venv with CPU-only torch
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python -e ".[dev]" \
            --index-url "$TORCH_INDEX" --extra-index-url https://pypi.org/simple \
            --index-strategy unsafe-best-match
      - name: Cache the pinned evaluation downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/data/vbd/zips
            .cache/models/gtcrn
          key: eval-assets-${{ hashFiles('python/earmark/eval/assets.tsv') }}
      - name: Fetch, verify and score (noisy PESQ 1.97 / STOI 0.921, GTCRN-VB PESQ 2.87)
        run: make gates
